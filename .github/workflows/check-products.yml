name: 링크 모음 점검

on:
  push:
    paths: ["shop/**", "scripts/check_products.py", ".github/workflows/check-products.yml"]
  pull_request:
    paths: ["shop/**", "scripts/check_products.py", ".github/workflows/check-products.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_products.py
